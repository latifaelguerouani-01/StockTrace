spring.application.name=stocktrace

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

stocktrace.jwt.secret=${STOCKTRACE_JWT_SECRET}
stocktrace.jwt.expiration=${STOCKTRACE_JWT_EXPIRATION:86400000}

server.port=${PORT:8080}
